<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAA Match Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5ef; --card:#fff; --ink:#14251a; --muted:#5d6b61; --line:#dfe5da;
  --pitch:#1e6a3a; --pitch2:#22743f; --accent:#f2b632; --accent-ink:#4a3500;
  --on:#1f8a4c; --off:#c2412d; --blue:#2f5fa8;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 2px 8px;display:flex;align-items:center;gap:10px}
header h1{font-family:"Barlow Condensed",sans-serif;font-size:22px;white-space:nowrap;margin:0;letter-spacing:.3px;flex:1;line-height:1}
header h1 span{color:var(--pitch)}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:#e6ebe2;color:var(--muted);white-space:nowrap}
.pill.live{background:#dff2e5;color:#17663a}
.pill.warn{background:#fdecc8;color:#7a5200}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 14px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-family:"Barlow Condensed";font-size:20px;line-height:1}
nav.tabs button.on{color:var(--pitch)}
nav.tabs button.on b{color:var(--pitch)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.card h2{font-family:"Barlow Condensed";font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfa;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--pitch)}
textarea{min-height:120px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--pitch);color:#fff}
.btn.alt{background:#e8ede4;color:var(--ink)}
.btn.warn{background:var(--off);color:#fff}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:14px}
.btn.wide{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-weight:600;font-size:14px;min-width:42px}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.chip.side.on{background:var(--blue);border-color:var(--blue)}
.seg{display:flex;background:#e8ede4;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--pitch)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.lbl:first-child{margin-top:0}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f0f3ec;width:38px;height:38px;font-size:20px;font-weight:700}
.stepper span{min-width:40px;text-align:center;font-weight:700;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.formgrid .f{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
/* player lists */
.plist{list-style:none;margin:0;padding:0}
.plist li{border-top:1px solid var(--line);padding:10px 0}
.plist li:first-child{border-top:0}
.prow{display:flex;align-items:center;gap:10px}
.prow .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;background:#eef2ea;color:#3d5444;border-radius:6px;padding:2px 6px;white-space:nowrap}
.tag.s{background:#e6edf8;color:var(--blue)}
.iconbtn{border:0;background:#eef2ea;border-radius:9px;min-width:38px;height:38px;font-weight:700;font-size:15px;padding:0 9px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn.on2{background:#dbe5f5;color:var(--blue)}
.iconbtn.on3{background:#fbe1dc;color:var(--off)}
.edit{margin-top:10px;padding:10px;background:#f6f8f3;border-radius:10px}
/* attendance */
.att{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.att:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid #b9c5b7;display:grid;place-items:center;background:#fff;flex:none;font-weight:800;color:#fff;font-size:18px}
.tick.on{background:var(--on);border-color:var(--on)}
.att .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.absent .nm{color:#9aa69c;font-weight:500}
.att .who{display:flex;flex:1;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:left}
.timing{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0 10px 40px}
.timing label{font-size:12px;font-weight:600;color:var(--muted)}
.counter{font-family:"Barlow Condensed";font-size:28px;line-height:1;color:var(--pitch)}
/* plan */
.summary{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.stat{background:#fff;border-radius:12px;padding:8px 12px;flex:none;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-family:"Barlow Condensed";font-size:24px;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.warnbox{background:#fff6e0;border:1px solid #f3dfa8;color:#6b4a00;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.warnbox div+div{margin-top:5px}
.pitch{background:repeating-linear-gradient(180deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px);border-radius:var(--r);padding:12px 6px;position:relative}
.pitch .lineRow{display:flex;justify-content:center;gap:6px;margin:6px 0}
.pitch .lineTag{color:rgba(255,255,255,.65);font-size:11px;font-weight:700;letter-spacing:.6px;text-align:center;margin-top:8px;text-transform:uppercase}
.slot{background:#fff;border-radius:10px;padding:6px 6px 5px;width:calc((100% - 12px)/3);max-width:150px;text-align:center;position:relative;min-height:54px}
.slot .num{position:absolute;top:-7px;left:-4px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 4px}
.slot b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot b.empty{color:var(--off)}
.slot .pos{font-size:11px;color:var(--muted);font-weight:600}
.slot .anc{font-size:11px}
.slot .chg{font-size:11.5px;color:var(--on);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px dashed var(--line);margin-top:3px;padding-top:2px}
.slot .chg.inj{color:var(--off)}
.slot.fit-bad{outline:2px solid #f0b8ad}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px}
.slot,.bchip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.slot.sel,.bchip.sel{outline:3px solid var(--accent);outline-offset:1px}
.slot.over,.bchip.over{outline:3px dashed var(--accent);outline-offset:1px}
.slot.dragging,.bchip.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.slot .chg.mv{color:var(--muted);font-weight:600}
.benchStrip{border-top:2px dashed rgba(255,255,255,.35);margin-top:12px;padding-top:4px}
.bchip{background:#f4f1e3;color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.bchip.late{opacity:.6;cursor:default}
.mvrow .txt{font-size:13.5px;color:var(--muted)}
.undo{border:0;background:#eef2ea;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ver{text-align:center;font-size:12px;color:var(--muted);padding:14px 0 4px}.ver a{color:var(--muted)}
.sharebtn{border:0;background:#e6ebe2;color:var(--pitch);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.menuitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:#f4f6f1;border-radius:12px;padding:12px;margin:0 0 8px}
.mi-ic{font-size:22px;width:30px;text-align:center}
.addbox{background:#f6f8f3;border-radius:12px;padding:12px;margin:0 0 12px}
.addbox .lbl:first-child{margin-top:0}
.iconbtn.on4{background:#d7ecf0;color:#1d6273}
.iconbtn{min-width:36px}
.offrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0 4px 40px}
.tag.pick{outline:2px solid var(--blue);outline-offset:-2px;background:#e6edf8;color:var(--blue)}
.pitchbar{display:flex;align-items:center;gap:8px;margin:-2px 4px 2px}
.pitchbar .sp{flex:1}
.pbtn{border:0;background:rgba(255,255,255,.95);color:var(--pitch);height:38px;min-width:42px;border-radius:10px;font-size:20px;font-weight:800;padding:0 10px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pbtn span{font-size:14px;font-weight:700}
.pbtn.wand{background:var(--accent);color:var(--accent-ink)}
.pbtn:disabled{opacity:.35;box-shadow:none}
.tl{list-style:none;margin:0;padding:0}
.tl > li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl > li:first-child{border-top:0}
.tl .t{font-family:"Barlow Condensed";font-size:24px;width:48px;flex:none;color:var(--pitch);line-height:1.1}
.tl .t small{display:block;font-family:Barlow;font-size:11px;color:var(--muted);font-weight:600}
.sw{display:flex;align-items:center;gap:8px;padding:4px 0}
.sw .txt{flex:1;min-width:0;font-size:15px;line-height:1.3}
.on-n{color:var(--on);font-weight:700}
.off-n{color:var(--off);font-weight:600}
.sw.done .txt{opacity:.45;text-decoration:line-through}
.mbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 36px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.mbar .bar{height:10px;border-radius:99px;background:#e8ede4;overflow:hidden}
.mbar .bar i{display:block;height:100%;background:var(--pitch);border-radius:99px}
.mbar .bar i.anc{background:var(--accent)}
.mbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mbar .m{text-align:right;font-weight:700}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted)}
.empty-state .big{font-family:"Barlow Condensed";font-size:26px;color:var(--ink);margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet textarea{min-height:260px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--pitch)}
.toggle{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 0;text-align:left;width:100%}
.sw-ui{width:44px;height:26px;border-radius:99px;background:#cfd8cc;position:relative;flex:none;transition:background .15s}
.sw-ui::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-ui.on{background:var(--pitch)}
.sw-ui.on::after{left:21px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ---------- constants ---------- */
const LINES=[
  {k:'GK',name:'Goalkeeper',short:'GK'},
  {k:'FB',name:'Full back',short:'FB'},
  {k:'HB',name:'Half back',short:'HB'},
  {k:'MID',name:'Midfield',short:'MID'},
  {k:'HF',name:'Half forward',short:'HF'},
  {k:'FF',name:'Full forward',short:'FF'}
];
const DEFAULT_FORM={7:[1,2,1,1,1,1],9:[1,2,2,1,2,1],11:[1,2,2,2,2,2],13:[1,3,2,2,2,3],15:[1,3,3,2,3,3]};
const PRESETS={15:['1-3-3-2-3-3','1-3-3-3-3-2'],13:['1-3-2-2-2-3','1-2-3-2-3-2','1-3-3-2-2-2'],11:['1-2-2-2-2-2','1-2-3-1-3-1'],9:['1-2-2-1-2-1'],7:['1-2-1-1-1-1']};
const SIDES={L:'Left',R:'Right',E:'Either'};
const APP_VERSION='v0.5',REPO_URL='https://github.com/nmmh/gaa-planner';
let commitInfo=null;
function verHtml(){
  const help=`<a href="${REPO_URL}/blob/main/help.md" target="_blank" rel="noopener"><b>Help</b></a>`;
  if(commitInfo)return `${help} · <a href="${commitInfo.url}" target="_blank" rel="noopener">${APP_VERSION} · ${commitInfo.sha}</a> · ${commitInfo.date} · <a href="${REPO_URL}/commits/main" target="_blank" rel="noopener">history</a>`;
  return `${help} · <a href="${REPO_URL}/commits/main" target="_blank" rel="noopener">${APP_VERSION}</a>`;
}
// on GitHub Pages, look up the commit this page was published from
async function loadCommit(){
  if(!/github\.io$/.test(location.hostname))return;
  try{const r=await fetch('https://api.github.com/repos/nmmh/gaa-planner/commits?path=index.html&per_page=1');if(!r.ok)return;
    const c=(await r.json())[0];if(!c)return;
    commitInfo={sha:c.sha.slice(0,7),url:c.html_url,date:new Date(c.commit.committer.date).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
    const f=document.querySelector('footer.ver');if(f)f.innerHTML=verHtml();
  }catch(e){}
}
const LS_KEY='hurling-sub-planner-v1';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}h^=h>>>13;h=Math.imul(h,1274126177);return ((h>>>0)%100000)/100000;}
function shortName(n){n=String(n||'').trim();const parts=n.split(/\s+/);if(parts.length<2||n.length<=13)return n;return parts[0]+' '+parts[parts.length-1][0]+'.';}
function sumForm(f){return f.reduce((a,b)=>a+b,0);}
function fm(t){t=Math.round(t*2)/2;return Number.isInteger(t)?String(t):(Math.floor(t)||'')+'½';}
function minLabel(t,M){return t===M.half?'HT':fm(t)+"'";}
function quarters(T){return [T/4,T/2,3*T/4].map(x=>Math.round(x*2)/2);}
function isQuarters(M){const q=quarters(M.half*2);const w=M.windows.slice().sort((a,b)=>a-b);return w.length===3&&w.every((x,i)=>x===q[i]);}
function periodName(i,a,b,M){return isQuarters(M)?'Q'+(i+1):(fm(a)+'–'+fm(b)+"'");}

function defaultMatch(){
  return {opp:'',date:'',size:15,form:DEFAULT_FORM[15].slice(),half:25,subs:6,windows:[12.5,25,37.5],rolling:true,
    present:{},anchor:{},lock:{},sitOut:{},benchStart:{},late:{},injured:{},seed:1,done:{},equal:true,moves:[],rsvp:{},plan:null};
}
function autoWindows(T,S){
  if(S<=0)return [];
  const w=S<=2?S:(S<=6?3:4);
  const out=[];for(let i=1;i<=w;i++)out.push(Math.round(T*i/(w+1)));
  return out;
}
function normPanel(p){
  p=p&&typeof p==='object'?p:{};
  const players=Array.isArray(p.players)?p.players.filter(x=>x&&x.id&&typeof x.name==='string').map(x=>({
    id:String(x.id),name:String(x.name).slice(0,60),
    lines:Array.isArray(x.lines)?x.lines.map(Number).filter(n=>n>=0&&n<=5):[],
    side:SIDES[x.side]?x.side:'E'})):[];
  return {players};
}
function normMatch(m){
  const d=defaultMatch();m=m&&typeof m==='object'?JSON.parse(JSON.stringify(m)):{};
  const o=Object.assign(d,m);
  ['present','anchor','lock','sitOut','benchStart','late','injured','done','rsvp'].forEach(k=>{if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={};});
  // v0.5: core (©) and per-quarter Off picks removed; "sits out Q1" becomes B again
  Object.keys(o.sitOut).forEach(id=>{const v=o.sitOut[id];if(v&&typeof v==='object'&&v[0])o.benchStart[id]=true;});
  o.sitOut={};o.anchor={};o.moves=[];
  if(!o.plan||typeof o.plan!=='object'||!Array.isArray(o.plan.lineups))o.plan=null;
  if(!Array.isArray(o.form)||o.form.length!==6)o.form=DEFAULT_FORM[15].slice();
  o.form=o.form.map(n=>Math.max(0,Math.min(6,+n||0)));
  o.form[0]=Math.min(1,o.form[0]);
  o.size=sumForm(o.form);
  o.half=Math.max(5,Math.min(60,+o.half||30));
  o.subs=Math.max(0,Math.min(40,+o.subs||0));
  o.windows=Array.isArray(o.windows)?[...new Set(o.windows.map(n=>Math.round(+n*2)/2))].filter(n=>n>0&&n<o.half*2):[];
  o.rolling=o.rolling!==false;o.moves=Array.isArray(o.moves)?o.moves.filter(m=>m&&m.id&&m.a&&typeof m.t==='number'):[];o.equal=!!o.equal;
  o.seed=+o.seed||1;
  return o;
}

/* ---------- state ---------- */
let state={panel:{players:[]},match:defaultMatch()};
let ui={tab:null,editing:null,timing:null,confirmReset:false,confirmDel:null,sheet:null,addName:'',addLines:[],addSide:'E',bulk:'',sync:'local'};
try{const raw=localStorage.getItem(LS_KEY);if(raw){const j=JSON.parse(raw);state.panel=normPanel(j.panel);state.match=normMatch(j.match);}}catch(e){}

/* ---------- position fit ---------- */
function fit(p,slot){
  const lines=p.lines||[];
  const isGK=slot.line===0, hasGK=lines.includes(0);
  if(isGK)return hasGK?12:-20;
  let best=-Infinity;
  for(const l of lines){if(l===0)continue;const d=Math.abs(l-slot.line);best=Math.max(best,d===0?8:d===1?3:-2*d);}
  if(!lines.length)best=0; else if(best===-Infinity)best=-10; // keeper only
  const ps=p.side||'E';let s=0;
  if(slot.side==='L')s=ps==='L'?2:ps==='E'?1:-1;
  else if(slot.side==='R')s=ps==='R'?2:ps==='E'?1:-1;
  else s=ps==='E'?1:0.5;
  return best+s;
}
function sidesFor(c){
  if(c===1)return['C'];if(c===2)return['R','L'];if(c===3)return['R','C','L'];
  return Array.from({length:c},(_,i)=>i===0?'R':i===c-1?'L':'C');
}
function buildSlots(form){
  const slots=[];let n=1;
  form.forEach((c,li)=>{sidesFor(c).forEach(s=>{
    const lab=li===0?'GK':(s==='C'?'C ':s+' ')+LINES[li].short;
    slots.push({id:slots.length,line:li,side:s,num:n++,label:lab});
  });});
  return slots;
}

/* ---------- starting team ---------- */
function pickStarters(avail,slots,M){
  const pri=p=>M.benchStart[p.id]?-1000:0;
  const val=(p,s)=>fit(p,s)+pri(p)+hash(M.seed+':'+p.id+':start')*2.5;
  const assign=new Array(slots.length).fill(null);const used=new Set();

    M.moves.filter(m=>m.t===t).forEach(m=>{
      const a=present.find(p=>p.id===m.a),b=m.b?present.find(p=>p.id===m.b):null;

      if(bi===-2||(ai<0&&bi<0)){moveBad[m.id]=true;return;}
      if(ai>=0&&bi>=0){ // both on the pitch: position change
        if(b){place(ai,b,t,'move');place(bi,a,t,'move');}else{place(ai,null,t);place(bi,a,t,'move');}
        entry.items.push({kind:'move',a,b,aTo:slots[bi],bTo:b?slots[ai]:null,mid:m.id});
        if(M.lock[a.id]&&t>0)home[a.id]=bi;if(b&&M.lock[b.id]&&t>0)home[b.id]=ai;
      }else{ // one on, one off: manual sub
        const fp=ai>=0?a:b,bp=ai>=0?b:a,si=ai>=0?ai:bi;
        place(si,bp,t,'manual');st[bp.id]='field';if(fp){st[fp.id]='bench';subbedOff.add(fp.id);}if(t>0)used++;

    const h=home[b.id];if(h===si||field[si]!==b)return;
    const o=field[h];
    if(o&&M.lock[o.id]&&home[o.id]===h)return; // another locked player owns it
    const kind=hist[si].length?hist[si][hist[si].length-1].kind:'sub';
    setSlot(h,b,t,kind);setSlot(si,o,t,'move');
    entry.items.forEach(it=>{if(it.on===b&&it.slot===slots[si])it.slot=slots[h];});

        else{setSlot(si,null,t);entry.items.push({kind:'short',off:p,slot:slots[si]});}
      }else{st[p.id]='out';entry.items.push({kind:'injbench',p});}
    });
    const wi=windows.indexOf(t);
    if(wi>=0&&M.equal){
      entry.window=true;
      const nextT=times.find(x=>x>t&&windows.includes(x))||T;const L=nextT-t;
      const cands=present.filter(p=>st[p.id]==='field'||st[p.id]==='bench');
      const pi=wi+1;
      const prio=p=>M.anchor[p.id]?1e6:sitsOut(M,p.id,pi)?-1e6:hasPlan(M,p.id)?1e5:(target[p.id]-mins[p.id])+(st[p.id]==='field'?L*0.5:0)+nz(p.id,'e'+t)*0.1;
      const rotSlots=field.map((p,si)=>(!p||!M.anchor[p.id])?si:-1).filter(si=>si>=0);
      const fieldAnch=field.filter(p=>p&&M.anchor[p.id]);
      const ranked=cands.filter(p=>!fieldAnch.includes(p)).sort((a,b)=>prio(b)-prio(a));
      const chosen=new Set(ranked.slice(0,rotSlots.length).map(p=>p.id));
      let inc=ranked.filter(p=>chosen.has(p.id)&&st[p.id]==='bench');
      const justOnE=new Set();
      const doSwap=(si,b,f)=>{setSlot(si,b,t);st[b.id]='field';if(f){st[f.id]='bench';subbedOff.add(f.id);}used++;justOnE.add(b.id);

  else if(!present.length)warnings.push('Nobody ticked as here yet. Use the Match tab.');

    if((M.equal||M.subs>0)&&!windows.length)warnings.push('No sub windows set. Add some times on the Match tab.');
    if(overLimit&&!M.equal)warnings.push('Injury replacements take you past the sub limit.');

    if(sitting.length)warnings.push(`${nm}: not enough positions for everyone you planned to play, so ${sitting.map(p=>esc(shortName(p.name))).join(', ')} sit${sitting.length===1?'s':''} out too.`);
  });

}

/* ---------- stored line-ups (filled by the wand, then edited by hand) ---------- */
function curBounds(M){const T=M.half*2;const w=[...new Set(M.windows.filter(t=>t>0&&t<T))].sort((a,b)=>a-b);return [0,...w,T];}

// fit a stored plan to the current formation and change times

  const oldForm=String(plan.form||'').split('-').map(Number);
  if(plan.form!==form&&oldForm.length===6){
    const oldSlots=buildSlots(oldForm);
    const pl=id=>state.panel.players.find(x=>x.id===id);
    L=L.map(lu=>{const out=new Array(slots.length).fill(null),spare=[];

// everything the Plan tab shows, worked out from the stored line-ups
function derive(){

  const benchTxt=i=>{const pr=P.periods[i];const n=[...pr.off.map(p=>shortName(p.name)),...pr.notYet.map(p=>shortName(p.name)+' (late)')];return 'Bench: '+(n.join(', ')||'nobody');};

  idx.forEach((pi,k)=>{
    const x=pad+(k%cols)*(PW+pad),y=headH+Math.floor(k/cols)*(panelH+pad),pr=P.periods[pi];
    const g=ctx.createLinearGradient(0,y,0,y+panelH);g.addColorStop(0,'#22743f');g.addColorStop(1,'#1e6a3a');
    rr(ctx,x,y,PW,panelH,18);ctx.fillStyle=g;ctx.fill();

let undoStack=[],redoStack=[];

let db=null,refs={},saving={panel:false,match:false},dirty={panel:false,match:false},timers={},readOnly=false,gotRemote={panel:false,match:false};
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function persist(which){
  lsSave();
  if(!db||readOnly)return;
  dirty[which]=true;clearTimeout(timers[which]);timers[which]=setTimeout(()=>flush(which),600);
}
async function flush(which){
  if(saving[which]){timers[which]=setTimeout(()=>flush(which),400);return;}
  if(!dirty[which])return;
  dirty[which]=false;saving[which]=true;
  try{await refs[which].set(JSON.parse(JSON.stringify(state[which])));setSync('live');}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;setSync('readonly');}
    else if(e&&e.code==='unavailable'){dirty[which]=true;timers[which]=setTimeout(()=>flush(which),1500+Math.random()*1000);}
    else setSync('error');
  }
  saving[which]=false;
}
function setSync(s){if(ui.sync===s)return;ui.sync=s;const el=$('#sync');if(el)el.outerHTML=syncPill();}
function syncPill(){
  const m={local:['','On this phone'],live:['live','● Shared live'],readonly:['warn','View only'],error:['warn','Not syncing'],loading:['','Connecting…']}[ui.sync]||['',''];
  return `<span id="sync" class="pill ${m[0]}">${m[1]}</span>`;
}
async function initDb(){

  try{db=await window.claude.use('db');}catch(e){db=null;}
  if(!db)return;

  try{const u=await window.claude.use('user');if(u&&typeof u.can==='function'){const c=await u.can('data.write');if(c===false){readOnly=true;}}}catch(e){}
  refs.panel=db.doc('squad/panel');refs.match=db.doc('squad/match');
  const timer=setTimeout(()=>{if(!gotRemote.panel)setSync('error');},10000);
  ['panel','match'].forEach(which=>{
    refs[which].onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(dirty[which]||saving[which])return;
      if(snap.exists){
        const data=JSON.parse(JSON.stringify(snap.data()||{}));
        state[which]=which==='panel'?normPanel(data):normMatch(data);
        lsSave();scheduleRender();
      }else if(!(snap.metadata&&snap.metadata.fromCache)&&!gotRemote[which]){
        // empty shared store: seed it from what this phone has
        const has=which==='panel'?state.panel.players.length>0:Object.keys(state.match.present).length>0;
        if(has&&!readOnly)persist(which);

      if(!(snap.metadata&&snap.metadata.fromCache)){gotRemote[which]=true;clearTimeout(timer);setSync(readOnly?'readonly':'live');}
    },err=>{clearTimeout(timer);setSync('error');});

/* ---------- phone-to-phone sync (whole setup in a link) ---------- */
const HOME_URL='https://nmmh.github.io/gaa-planner/';
function shareBase(){return (location.protocol.indexOf('http')===0&&!/claude/i.test(location.hostname))?location.origin+location.pathname:HOME_URL;}
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
async function encodeState(){
  const json=JSON.stringify({v:1,panel:state.panel,match:state.match});
  if(window.CompressionStream){try{const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'z'+b64u(new Uint8Array(buf));}catch(e){}}
  return 'j'+b64u(new TextEncoder().encode(json));
}
async function decodeState(code){
  code=String(code||'').replace(/\s+/g,'');const m=code.match(/[#&?]s=([A-Za-z0-9_-]+)/);if(m)code=m[1];
  const kind=code[0],body=unb64u(code.slice(1));let json;
  if(kind==='z')json=await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  else if(kind==='j')json=new TextDecoder().decode(body);else throw new Error('bad code');
  const o=JSON.parse(json);return {panel:normPanel(o.panel),match:normMatch(o.match)};
}
async function sendToPhone(){
  const code=await encodeState();const link=shareBase()+'#s='+code;
  const M=state.match;const msg=`📋 ${M.opp?'vs '+M.opp+' – ':''}tap to load the full plan (panel, who's here, subs):\n${link}`;
  ui.sheet={mode:'copy',title:'Send to another phone',noteHtml:'Send this link to the other mentors. Opening it loads <b>everything</b> — panel, attendance, ©/⚓ marks, formation and your adjustments — on their phone. Send a new link whenever you change something.',text:msg,wa:'https://wa.me/?text='+encodeURIComponent(msg)};
  render();
}
async function offerImport(code){
  try{const d=await decodeState(code);ui.pending=d;
    const here=d.panel.players.filter(p=>d.match.present[p.id]).length;
    ui.sheet={mode:'confirm',title:'Load plan from another phone?',noteHtml:`${d.match.opp?'<b>vs '+esc(d.match.opp)+'</b> · ':''}${d.panel.players.length} players on the panel, ${here} ticked as here. This <b>replaces</b> the panel and match on this phone.`};
  }catch(e){ui.sheet=null;toast("That link or code didn't work — ask for a fresh one");}
  render();
}
function loadFromHash(){
  const h=location.hash||'';if(!/[#&]s=/.test(h))return;
  offerImport(h);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
}

/* ---------- RSVP report (ClubZap CSV) ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function cleanName(n){
  return String(n).replace(/\s+/g,' ').trim().split(' ').map(w=>(w.length>1&&w===w.toUpperCase()&&/[A-Z]/.test(w))?w.toLowerCase().replace(/(^|['’-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):w).join(' ');
}
function respCode(r){r=String(r).toLowerCase().trim();if(/not\s*attend|declin|unavail|^no\b|can'?t|absent/.test(r))return 'X';if(/attend|^yes|going|available|accept/.test(r))return 'A';return 'N';}
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
function parseRSVP(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r[0]&&r[0].trim().toLowerCase()==='name'&&r.some(c=>/response/i.test(c)));
  if(hi<0)return null;
  const ri=rows[hi].findIndex(c=>/response/i.test(c)),ti=rows[hi].findIndex(c=>/^\s*type\s*$/i.test(c));
  let event='',start='';
  rows.slice(0,hi).forEach(r=>{const k=(r[0]||'').trim().toLowerCase();if(k==='event')event=(r[1]||'').trim();if(k==='start')start=(r[1]||'').trim();});
  const people=rows.slice(hi+1).filter(r=>r[0]&&r[0].trim()&&(ti<0||!r[ti]||/player/i.test(r[ti]))).map(r=>({name:cleanName(r[0]),resp:respCode(r[ri]||'')}));
  let date='';const dm=start.match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(\d{4})/);
  if(dm){const mi=MONTHS.findIndex(x=>x.startsWith(dm[1].toLowerCase().slice(0,3)));if(mi>=0)date=`${dm[3]}-${String(mi+1).padStart(2,'0')}-${String(dm[2]).padStart(2,'0')}`;}
  const om=event.match(/\bv(?:s)?\.?\s+(.+)$/i);
  return {event,opp:om?om[1].trim():'',date,people};
}
function findOrAdd(name,added){
  const n=normName(name);let p=state.panel.players.find(x=>normName(x.name)===n);
  if(!p){const r=matchNames(name);if(r.found.length===1&&!r.missing.length)p=r.found[0];}
  if(!p){p={id:uid(),name:name.slice(0,60),lines:[],side:'E'};state.panel.players.push(p);added.push(p);}
  return p;
}
function applyRSVP(r,toMatch){
  const added=[];const M=state.match;const ids={};
  r.people.forEach(x=>{const p=findOrAdd(x.name,added);ids[p.id]=x.resp;});
  persist('panel');
  if(!toMatch)return `Panel: added ${added.length} new player${added.length===1?'':'s'}, ${r.people.length-added.length} already on it.`+(added.length?' Set their positions below.':'');
  M.present={};M.rsvp=ids;
  Object.keys(ids).forEach(id=>{if(ids[id]==='A')M.present[id]=true;});
  ['anchor','lock','sitOut','late','injured'].forEach(k=>Object.keys(M[k]).forEach(id=>{if(!M.present[id])delete M[k][id];}));
  M.moves=[];M.done={};
  if(r.opp)M.opp=r.opp;if(r.date)M.date=r.date;
  persist('match');
  const c=k=>Object.values(ids).filter(v=>v===k).length;
  return `<b>${c('A')} attending</b> ticked · ${c('N')} not replied · ${c('X')} not coming.`+(added.length?` Added ${added.length} new to the panel (${added.map(p=>esc(p.name)).join(', ')}) — set their positions on the Panel tab.`:'')+' Tick or untick on the day as needed.';
}
function readFile(input,cb){const f=input.files&&input.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{cb(String(fr.result));input.value='';};fr.readAsText(f);}

function whatsappText(){
  const M=state.match,P=derive();
  const L=[];
  L.push(`📋 ${M.opp?'vs '+M.opp:'Match plan'}${M.date?' – '+new Date(M.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):''}`);
  L.push(`${P.slots.length}-a-side · 2×${M.half} mins · ${P.present.length} here`);
  L.push('');L.push('*STARTING*');
  LINES.forEach((l,li)=>{const ss=P.slots.filter(s=>s.line===li);if(!ss.length)return;
    L.push(`${l.short}: `+ss.map(s=>{const p=P.starters[s.id];return `${s.num} ${p?shortName(p.name)+(M.lock[p.id]?' 🔒':''):'—'}`;}).join(' · '));});
  const bench0=P.avail0.filter(p=>!P.starters.includes(p));
  const late=P.present.filter(p=>P.lateAt(p.id)>0);
  L.push('');L.push('*BENCH*: '+([...bench0.map(p=>p.name),...late.map(p=>p.name+' (late '+P.lateAt(p.id)+"')")].join(', ')||'none'));
  L.push('');L.push('*OFF EACH '+(isQuarters(M)?'QUARTER':'PERIOD')+'*');
  P.periods.forEach((pr,i)=>L.push(`${periodName(i,pr.a,pr.b,M)}: ${pr.off.map(p=>shortName(p.name)).join(', ')||'nobody'}${pr.notYet.length?' (not here yet: '+pr.notYet.map(p=>shortName(p.name)).join(', ')+')':''}`));
  L.push('');L.push('*SUBS*');
  if(!P.plan)L.push('No plan yet — press the wand on the Plan tab.');
  P.timeline.forEach(e=>{
    const its=e.items.filter(i=>['sub','fill','move'].includes(i.kind));
    if(!its.length)return;
    L.push(`${e.t===0?'Start':minLabel(e.t,M)}${e.t===M.half?' ('+fm(e.t)+"')":''}`);
    its.forEach(i=>L.push(i.kind==='move'?`  ↔ ${i.a.name} to ${i.aTo.label}`:`  ▲ ${i.on.name}${i.off?' for '+i.off.name:''} (${i.slot.label})`));
  });
  L.push('');L.push('*MINUTES*');
  P.present.slice().sort((a,b)=>P.mins[b.id]-P.mins[a.id]).forEach(p=>L.push(`${fm(P.mins[p.id])}' ${p.name}`));
  return L.join('\n');
}
function panelText(){
  return sortedPlayers().map(p=>`${p.name}, ${(p.lines||[]).slice().sort().map(l=>LINES[l].short).join(' ')}${p.side!=='E'?', '+p.side:''}`).join('\n');
}
function parseBulk(text){
  const out=[];
  text.split(/\n+/).forEach(line=>{
    line=line.trim().replace(/^\d+[\.\)]\s*/,'');if(!line)return;
    const parts=line.split(/[,\t;|]/);const name=parts.shift().trim();if(!name)return;
    let s=' '+parts.join(' ').toLowerCase()+' ';
    s=s.replace(/half[\s-]*backs?/g,' hb ').replace(/half[\s-]*forwards?/g,' hf ').replace(/(full|corner)[\s-]*backs?/g,' fb ')
       .replace(/(full|corner)[\s-]*forwards?/g,' ff ').replace(/midfield(er)?s?|centre[\s-]*field/g,' mid ')
       .replace(/goal[\s-]*keeper|goalie|keeper|goals?/g,' gk ').replace(/\b(defen[cs]e|defender|back)s?\b/g,' fb hb ')
       .replace(/\b(forward|attack|attacker)s?\b/g,' hf ff ');
    const toks=s.split(/[^a-z]+/).filter(Boolean);
    const map={gk:0,fb:1,hb:2,mid:3,mf:3,hf:4,ff:5,cf:5};
    const lines=[];let side='E';
    toks.forEach(t=>{if(t in map){if(!lines.includes(map[t]))lines.push(map[t]);}
      else if(t==='l'||t==='left')side='L';else if(t==='r'||t==='right')side='R';});
    out.push({id:uid(),name:name.slice(0,60),lines,side});
  });
  return out;
}

function normName(n){return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();}
function matchNames(text){
  const ps=state.panel.players.map(p=>({p,n:normName(p.name)}));
  const found=[],missing=[];
  text.split(/[\n,;]+/).forEach(raw=>{
    let line=raw.replace(/^\s*\d+[\.\)]?\s*/,'').replace(/\b(available|yes|going|attending|confirmed)\b/gi,'').trim();
    const n=normName(line);if(!n||n.length<2)return;
    let hit=ps.filter(x=>x.n===n);
    if(!hit.length)hit=ps.filter(x=>x.n.includes(n)||n.includes(x.n));
    if(hit.length!==1){const t=n.split(' ');if(t.length>1)hit=ps.filter(x=>{const u=x.n.split(' ');return u[0]===t[0]&&u[u.length-1].startsWith(t[t.length-1][0])&&u[u.length-1].startsWith(t[t.length-1].replace(/\.$/,''));});}
    if(hit.length===1){if(!found.includes(hit[0].p))found.push(hit[0].p);}else missing.push(line);
  });
  return {found,missing};
}
function makeMove(src,dst){return editPlan(src,dst);}
/* drag: mouse drags straight away; touch needs a short press-and-hold so the page still scrolls */
let drag=null,ignoreClick=0;
function dzInfo(el){return el.dataset.slot!=null?{slot:+el.dataset.slot}:{pid:el.dataset.pid};}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-dz]');if(!el)return;
  drag={el,x:e.clientX,y:e.clientY,started:false,touch:e.pointerType!=='mouse',ghost:null,over:null};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.started)startDrag(drag.x,drag.y);},300);
});
function startDrag(x,y){
  drag.started=true;const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);drag.ghost=g;
  drag.el.classList.add('dragging');moveGhost(x,y);if(navigator.vibrate)try{navigator.vibrate(15);}catch(e){}
}
function moveGhost(x,y){
  drag.ghost.style.left=(x-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(y-30)+'px';
  const t=document.elementFromPoint(x,y);const dz=t&&t.closest('[data-dz]');
  if(drag.over&&drag.over!==dz)drag.over.classList.remove('over');
  if(dz&&dz!==drag.el){dz.classList.add('over');drag.over=dz;}else drag.over=null;
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;const d=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(!drag.started){
    if(drag.touch){if(d>8){clearTimeout(drag.timer);drag=null;}else{drag.x=e.clientX;drag.y=e.clientY;}return;}
    if(d>6)startDrag(e.clientX,e.clientY);else return;
  }
  moveGhost(e.clientX,e.clientY);
});
function endDrag(e,cancel){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.started){
    const src=dzInfo(drag.el),over=drag.over;
    drag.ghost.remove();drag.el.classList.remove('dragging');if(over)over.classList.remove('over');
    ignoreClick=Date.now();
    if(!cancel&&over){ui.sel=null;drag=null;const before=snap();makeMove(src,dzInfo(over));recordUndo(before);render();return;}
  }
  drag=null;
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('touchmove',e=>{if(drag&&drag.started)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-dz]'))e.preventDefault();});
/* ---------- actions ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}
function copyText(text,title,note){
  ui.sheet={mode:'copy',title,note:note||'',text,wa:'https://wa.me/?text='+encodeURIComponent(text)};render();

function findP(id){return state.panel.players.find(p=>p.id===id);}
function act(a,el){
  const M=state.match,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':ui.sel=null;ui.tab=v;ui.editing=null;ui.timing=null;ui.confirmReset=false;render();window.scrollTo(0,0);return;
    case 'addLine':{const i=+v;ui.addLines=ui.addLines.includes(i)?ui.addLines.filter(x=>x!==i):[...ui.addLines,i];break;}
    case 'addSide':ui.addSide=v;break;
    case 'addPlayer':{
      const n=(ui.addName||'').trim();if(!n){toast('Type a name first');const i=$('#addName');if(i)i.focus();return;}
      state.panel.players.push({id:uid(),name:n.slice(0,60),lines:ui.addLines.slice(),side:ui.addSide});
      ui.addName='';ui.addLines=[];ui.addSide='E';persist('panel');render();toast('Added '+n);const i=$('#addName');if(i)i.focus();return;}
    case 'bulkToggle':ui.bulkOpen=!ui.bulkOpen;return;
    case 'bulkAdd':{const ps=parseBulk(ui.bulk||'');if(!ps.length){toast('Nothing to add');return;}
      state.panel.players.push(...ps);ui.bulk='';ui.bulkOpen=false;persist('panel');toast(`Added ${ps.length} players`);break;}
    case 'sample':{const ps=parseBulk(SAMPLE);state.panel.players.push(...ps);persist('panel');toast('Sample squad loaded');break;}
    case 'copyPanel':copyText(panelText(),'Panel list','On another phone, paste it into + Add player(s) → Or paste a list of names. Also handy as a backup.');return;
    case 'edit':ui.editing=ui.editing===id?null:id;ui.confirmDel=null;break;
    case 'pLine':{const p=findP(id);if(!p)return;const i=+v;p.lines=p.lines.includes(i)?p.lines.filter(x=>x!==i):[...p.lines,i];persist('panel');break;}
    case 'pSide':{const p=findP(id);if(!p)return;p.side=v;persist('panel');break;}
    case 'del':ui.confirmDel=id;break;
    case 'delNo':ui.confirmDel=null;break;
    case 'delYes':state.panel.players=state.panel.players.filter(p=>p.id!==id);['present','anchor','lock','sitOut','late','injured'].forEach(k=>delete M[k][id]);ui.editing=null;ui.confirmDel=null;persist('panel');persist('match');break;
    case 'size':{const n=+v;M.form=DEFAULT_FORM[n].slice();M.size=n;persist('match');break;}
    case 'form':{const i=+el.dataset.i;M.form[i]=Math.max(0,Math.min(6,M.form[i]+(+v)));M.size=sumForm(M.form);persist('match');break;}
    case 'half':{const q=isQuarters(M);M.half=Math.max(5,Math.min(60,M.half+5*(+v)));const T=M.half*2;M.windows=(q||M.equal)?quarters(T):autoWindows(T,M.subs);persist('match');break;}
    case 'winQ':M.windows=quarters(M.half*2);persist('match');break;
    case 'mode':M.equal=v==='eq';if(M.equal&&M.windows.length<3)M.windows=quarters(M.half*2);persist('match');break;
    case 'subs':{const old=M.subs;M.subs=Math.max(0,Math.min(40,M.subs+(+v)));
      const autoBefore=JSON.stringify(autoWindows(M.half*2,old))===JSON.stringify(M.windows.slice().sort((a,b)=>a-b));
      if(autoBefore||!M.windows.length)M.windows=autoWindows(M.half*2,M.subs);persist('match');break;}
    case 'winDel':M.windows=M.windows.filter(t=>t!==+v);persist('match');break;
    case 'winAuto':M.windows=autoWindows(M.half*2,M.subs);persist('match');break;
    case 'rolling':M.rolling=!M.rolling;persist('match');break;
    case 'equal':M.equal=!M.equal;if(M.equal&&M.windows.length<3)M.windows=autoWindows(M.half*2,Math.max(M.subs,6));persist('match');break;
    case 'formSet':{const f=v.split('-').map(Number);M.form=f;M.size=sumForm(f);persist('match');break;}
    case 'availToggle':ui.availOpen=!ui.availOpen;return;
    case 'availApply':{const rv=parseRSVP(ui.avail||'');if(rv&&rv.people.length){ui.availMsg=applyRSVP(rv,true);break;}
      const r=matchNames(ui.avail||'');if(!r.found.length){ui.availMsg='No names matched the panel.';break;}
      M.present={};r.found.forEach(p=>M.present[p.id]=true);['anchor','lock'].forEach(k=>Object.keys(M[k]).forEach(id=>{if(!M.present[id])delete M[k][id];}));Object.keys(M.sitOut).forEach(id=>{if(!M.present[id])delete M.sitOut[id];});
      ui.availMsg=`Ticked ${r.found.length}.`+(r.missing.length?` Not on the panel: <b>${r.missing.map(esc).join(', ')}</b> — add them on the Panel tab, then paste again.`:'');
      persist('match');break;}
    case 'present':if(M.present[id]){delete M.present[id];delete M.anchor[id];delete M.lock[id];delete M.benchStart[id];}else M.present[id]=true;persist('match');break;
    case 'allIn':state.panel.players.forEach(p=>M.present[p.id]=true);persist('match');break;
    case 'allOut':M.present={};M.anchor={};M.lock={};M.benchStart={};persist('match');break;
    case 'lock':if(M.lock[id])delete M.lock[id];else M.lock[id]=true;persist('match');break;
    case 'anchor':if(M.anchor[id])delete M.anchor[id];else{M.anchor[id]=true;delete M.sitOut[id];}persist('match');break;
    case 'offOpen':ui.offFor=ui.offFor===id?null:id;ui.timing=null;break;
    case 'sit':{const i=+v;const cur=Object.assign({},M.sitOut[id]||{});if(cur[i])delete cur[i];else cur[i]=true;
      if(Object.keys(cur).length){M.sitOut[id]=cur;delete M.anchor[id];}else delete M.sitOut[id];persist('match');break;}
    case 'sitClear':M.sitOut={};persist('match');toast('Sit-out picks cleared');break;
    case 'timing':ui.timing=ui.timing===id?null:id;ui.offFor=null;break;
    case 'reset':ui.confirmReset=true;break;
    case 'resetNo':ui.confirmReset=false;break;
    case 'resetYes':Object.assign(M,{present:{},anchor:{},lock:{},sitOut:{},benchStart:{},late:{},injured:{},done:{},moves:[],rsvp:{},plan:null,opp:'',date:''});ui.rsvpMsg='';ui.confirmReset=false;persist('match');toast('Ready for a new match');break;
    case 'shuffle':M.seed=(M.seed%9973)+1;M.done={};M.moves=[];ui.sel=null;persist('match');toast('New combination');break;
    case 'view':ui.view=+v;ui.sel=null;break;
    case 'wand':{const had=!!M.plan;wand();ui.sel=null;toast(had?'New selection — ↶ to go back':'Team suggested — tweak it by hand');break;}
    case 'undo':undoRedo(true);return;
    case 'redo':undoRedo(false);return;
    case 'bench':if(M.benchStart[id])delete M.benchStart[id];else M.benchStart[id]=true;persist('match');break;
    case 'image':openImage(ui.imgWhich||'one');return;
    case 'imgWhich':openImage(v);return;
    case 'imgShare':if(ui.imgFile){navigator.share({files:[ui.imgFile],title:ui.imgFile.name}).catch(()=>{});}return;
    case 'pick':{const tgt=el.dataset.slot!=null?{slot:+el.dataset.slot}:{pid:el.dataset.pid};
      if(!ui.sel){ui.sel=tgt;break;}
      const same=(ui.sel.slot!=null&&ui.sel.slot===tgt.slot)||(ui.sel.pid&&ui.sel.pid===tgt.pid);
      const src=ui.sel;ui.sel=null;if(same)break;
      makeMove(src,tgt);break;}
    case 'undoMove':M.moves=M.moves.filter(m=>m.id!==v);persist('match');toast('Change undone');break;
    case 'undoAll':M.moves=[];ui.sel=null;persist('match');toast('Back to the suggested plan');break;
    case 'clearBad':{const P=simulate();M.moves=M.moves.filter(m=>!P.moveBad[m.id]);persist('match');break;}
    case 'done':if(M.done[v])delete M.done[v];else M.done[v]=true;persist('match');break;
    case 'whatsapp':copyText(whatsappText(),'Plan for WhatsApp','Copy this and paste it into the mentors group. A screenshot of this page works too.');return;
    case 'sheetCopy':{const ta=$('#sheetText');if(ta){ta.focus();ta.select();}try{navigator.clipboard.writeText(ui.sheet.text).then(()=>toast('Copied'),()=>toast('Text selected — use Copy'));}catch(e){toast('Text selected — use Copy');}return;}
    case 'sheetClose':ui.sheet=null;ui.pending=null;break;
    case 'send':sendToPhone();return;
    case 'shareMenu':ui.sheet={mode:'menu',title:'Share',note:'Send to the other mentors, or load what they sent you.'};break;
    case 'addOpen':ui.addOpen=!ui.addOpen;if(!ui.addOpen)ui.panelMsg='';break;
    case 'pasteOpen':ui.pasteCode='';ui.sheet={mode:'paste',title:'Load from another phone',note:'Paste the link (or code) another mentor sent you.'};break;
    case 'pasteLoad':offerImport(ui.pasteCode||'');return;
    case 'importYes':if(ui.pending){state.panel=ui.pending.panel;state.match=ui.pending.match;ui.pending=null;ui.sheet=null;ui.sel=null;ui.view=0;persist('panel');persist('match');ui.tab='plan';toast('Plan loaded');}break;
    case 'sheetBg':if(curEvent&&el===curEvent.target){ui.sheet=null;break;}return;
    default:return;
  }

}
let curEvent=null;
document.addEventListener('click',e=>{
  if(Date.now()-ignoreClick<400)return;

document.addEventListener('change',e=>{const before=snap();onChange(e);if(!/^rsvp/.test((e.target.dataset||{}).f||''))recordUndo(before);});
function onChange(e){
  const el=e.target;const f=el.dataset&&el.dataset.f;if(!f)return;const M=state.match,id=el.dataset.id;
  if(f==='date'){M.date=el.value;persist('match');render();}
  else if(f==='rsvpPanel'||f==='rsvpMatch'){readFile(el,txt=>{const r=parseRSVP(txt);
    if(!r||!r.people.length){toast("That doesn't look like a ClubZap RSVP report");return;}
    if(f==='rsvpPanel')ui.panelMsg=applyRSVP(r,false);else ui.rsvpMsg=applyRSVP(r,true);render();});}
  else if(f==='winNew'){const t=Math.round(+el.value*2)/2;if(t>0&&t<M.half*2&&!M.windows.includes(t)){M.windows.push(t);persist('match');}render();}
  else if(f==='late'){const t=Math.round(+el.value);if(el.value===''||!(t>0))delete M.late[id];else M.late[id]=t;persist('match');render();}
  else if(f==='inj'){if(el.value==='')delete M.injured[id];else M.injured[id]=Math.max(0,Math.round(+el.value));persist('match');render();}
  else if(f==='pname'||f==='opp'){render();}
  else if(f==='formText'){const n=(el.value.match(/\d+/g)||[]).map(Number);
    if(n.length!==6||n[0]>1||n.some(x=>x>6)||sumForm(n)<3){toast('Use 6 numbers: GK-FB-HB-MID-HF-FF, e.g. 1-2-3-2-3-2');return;}
    M.form=n;M.size=sumForm(n);persist('match');render();}
}
